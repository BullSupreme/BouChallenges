<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playlist - Bou Challenges</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <div style="display: flex; justify-content: space-between; align-items: center; width: 100%; gap: 10px;">
                <a href="playlists.html" class="back-button">← Back to Playlists</a>
                <h1 id="playlistTitle" style="flex: 1; text-align: center; margin: 0;">Playlist</h1>
                <div style="display: flex; gap: 10px;">
                    <button id="exportBtn" class="btn btn-primary">Export as HTML</button>
                </div>
            </div>
        </header>

        <main>
            <!-- Autoplay Controls -->
            <div style="display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 20px; padding: 15px; background: linear-gradient(135deg, #1e293b 0%, #253549 100%); border-radius: 8px;">
                <div id="autoplayContainer" style="display: flex; gap: 8px;">
                    <!-- Buttons will be added here by JavaScript -->
                </div>
            </div>

            <section class="challenge-section">
                <div class="songs-list">
                    <div id="playlistInfo" style="text-align: center; margin-bottom: 20px; padding: 15px; background: linear-gradient(135deg, #334155 0%, #475569 100%); border-radius: 8px;">
                        <!-- Playlist info will be displayed here -->
                    </div>
                    <div id="songsList" class="songs-container">
                        <!-- Rankings will be generated here -->
                    </div>
                </div>
            </section>
        </main>

        <footer>
            <p>Created by a Bou for a Bou | Made with ❤️</p>
        </footer>
    </div>

    <script src="../js/ranking-manager.js"></script>
    <script>
        class PlaylistViewerManager extends RankingManager {
            constructor() {
                // Get playlist from localStorage
                const playlistData = localStorage.getItem('activePlaylist');
                if (!playlistData) {
                    alert('No active playlist found');
                    window.location.href = 'playlists.html';
                    return;
                }

                const playlist = JSON.parse(playlistData);

                // Use a unique storage key for this playlist
                super(`playlist_${playlist.id}`, 'songs');

                this.playlist = playlist;
                this.loadMergedRankings();
            }

            loadMergedRankings() {
                // Set playlist title
                document.getElementById('playlistTitle').textContent = `📋 ${this.playlist.name}`;

                // Display playlist info
                const infoDiv = document.getElementById('playlistInfo');
                infoDiv.innerHTML = `
                    <h3 style="color: #f1f5f9; margin: 0 0 10px 0;">${this.playlist.name}</h3>
                    <p style="color: #cbd5e1; margin: 0;">
                        Contains: ${this.playlist.rankings.map(r => r.name).join(', ')}
                    </p>
                `;

                // Merge all rankings from the selected categories
                const mergedItems = [];
                let currentRank = 1;

                this.playlist.rankings.forEach(ranking => {
                    // Get data from localStorage for each ranking
                    const storageKey = this.getRankingStorageKey(ranking.id);
                    const rankingData = localStorage.getItem(storageKey);

                    if (rankingData) {
                        try {
                            const parsedData = JSON.parse(rankingData);
                            const items = parsedData.songs || parsedData.movies || parsedData.games || [];

                            // Add each item with its original title and source
                            items.forEach(item => {
                                if (item.title && item.title.trim()) {
                                    mergedItems.push({
                                        rank: currentRank++,
                                        title: item.title,
                                        artist: item.artist || '',
                                        platform: item.platform || 'YouTube',
                                        url: item.url || '',
                                        thumbnailUrl: item.thumbnailUrl || '',
                                        duration: item.duration || '',
                                        source: ranking.name // Add source category
                                    });
                                }
                            });
                        } catch (e) {
                            console.error(`Error loading ${ranking.name}:`, e);
                        }
                    }
                });

                // Save merged items
                this.items = mergedItems;
                this.saveItems();
                this.renderItems();
            }

            getRankingStorageKey(rankingId) {
                const keyMap = {
                    'animeOST': 'animeOST_songs',
                    'animeEnding': 'animeEnding_songs',
                    'animeOpening': 'animeOpening_songs',
                    'christmasMovies': 'christmasMovies_songs',
                    'disneySongs': 'disneySongs_songs',
                    'topMovies': 'topMovies_movies',
                    'topMovieSongs': 'topMovieSongs_songs',
                    'topVideoGames': 'topVideoGames_games',
                    'topVideoGamesMusic': 'topVideoGamesMusic_songs'
                };
                return keyMap[rankingId] || `${rankingId}_songs`;
            }

            initializeDefaults() {
                // No defaults needed - we load from merged rankings
                return [];
            }

            // Override renderItems to show source category
            renderItems() {
                const container = document.getElementById('songsList');
                if (!container) return;

                container.innerHTML = this.items.map(item => {
                    const platformClass = item.platform === 'YouTube' ? 'youtube-platform' :
                                        item.platform === 'Spotify' ? 'spotify-platform' :
                                        item.platform === 'SoundCloud' ? 'soundcloud-platform' : '';

                    return `
                        <div class="song-item" data-rank="${item.rank}">
                            <div class="rank-banner ${this.currentPlayingIndex === this.items.indexOf(item) ? 'playing' : ''}" style="position: relative;">
                                <span class="rank-number">#${item.rank}</span>
                                ${item.duration ? `<span class="song-duration">${item.duration}</span>` : ''}
                                <div style="position: absolute; top: 10px; left: 60px; background: rgba(51, 65, 85, 0.9); padding: 3px 8px; border-radius: 4px; font-size: 0.75em; color: #94a3b8;">
                                    ${item.source}
                                </div>
                            </div>
                            <div class="song-details">
                                <div class="song-info">
                                    <input type="text" class="song-title" placeholder="Song/Movie Title" value="${item.title}" data-rank="${item.rank}" data-field="title" readonly style="background: transparent; border: none; cursor: default;">
                                    <input type="text" class="song-artist" placeholder="Artist/Source" value="${item.artist}" data-rank="${item.rank}" data-field="artist" readonly style="background: transparent; border: none; cursor: default;">
                                </div>
                                <div class="song-actions">
                                    <select class="platform-select ${platformClass}" data-rank="${item.rank}" disabled style="opacity: 0.7; cursor: not-allowed;">
                                        <option value="YouTube" ${item.platform === 'YouTube' ? 'selected' : ''}>YouTube</option>
                                        <option value="Spotify" ${item.platform === 'Spotify' ? 'selected' : ''}>Spotify</option>
                                        <option value="SoundCloud" ${item.platform === 'SoundCloud' ? 'selected' : ''}>SoundCloud</option>
                                    </select>
                                    <input type="url" class="url-input" placeholder="Paste URL here" value="${item.url}" data-rank="${item.rank}" readonly style="background: transparent; border: 1px solid #334155; cursor: default;">
                                    ${item.thumbnailUrl ? `
                                        <div class="thumbnail-preview" style="position: relative;">
                                            <img src="${item.thumbnailUrl}" alt="Thumbnail" style="width: 60px; height: 60px; object-fit: cover; border-radius: 4px;">
                                        </div>
                                    ` : ''}
                                </div>
                            </div>
                            ${item.url && item.platform === 'YouTube' ? `
                                <div class="media-container" style="margin-top: 10px;">
                                    <div id="player-${item.rank}" class="youtube-player"></div>
                                </div>
                            ` : ''}
                        </div>
                    `;
                }).join('');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            new PlaylistViewerManager();
        });
    </script>
</body>
</html>
