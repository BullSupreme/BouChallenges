<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playlists - Bou Challenges</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <div style="display: flex; justify-content: space-between; align-items: center; width: 100%; gap: 10px;">
                <a href="../index.html" class="back-button">← Back Home</a>
                <h1 style="flex: 1; text-align: center; margin: 0;">📋 Playlists</h1>
                <button id="createPlaylistBtn" class="btn btn-primary" style="background: linear-gradient(135deg, #10b981 0%, #059669 100%);">+ Create Playlist</button>
            </div>
        </header>

        <main>
            <!-- Playlists List Section -->
            <section class="challenge-section" style="margin-bottom: 30px;">
                <h2 style="text-align: center; margin-bottom: 20px;">Your Playlists</h2>
                <div id="playlistsList" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px;">
                    <!-- Playlists will be rendered here -->
                </div>
            </section>
        </main>

        <footer>
            <p>Created by a Bou for a Bou | Made with ❤️</p>
        </footer>
    </div>

    <!-- Create/Edit Playlist Modal -->
    <div id="playlistModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8); z-index: 1000; align-items: center; justify-content: center;">
        <div style="background: #1e293b; padding: 30px; border-radius: 12px; max-width: 800px; width: 90%; max-height: 90vh; overflow-y: auto;">
            <h2 id="modalTitle" style="color: #f1f5f9; margin-bottom: 20px;">Create Playlist</h2>

            <div style="margin-bottom: 20px;">
                <label style="color: #cbd5e1; display: block; margin-bottom: 8px;">Playlist Name:</label>
                <input type="text" id="playlistNameInput" placeholder="Enter playlist name" style="width: 100%; padding: 10px; background: #0f172a; border: 2px solid #334155; border-radius: 6px; color: #f1f5f9; font-size: 1em;">
            </div>

            <div style="margin-bottom: 20px;">
                <h3 style="color: #f1f5f9; margin-bottom: 15px;">Add Rankings to Playlist</h3>
                <div id="availableRankings" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px;">
                    <!-- Available rankings will be listed here -->
                </div>
            </div>

            <div style="margin-bottom: 20px;">
                <h3 style="color: #f1f5f9; margin-bottom: 15px;">Selected Rankings (<span id="selectedCount">0</span>)</h3>
                <div id="selectedRankings" style="min-height: 100px; padding: 15px; background: #0f172a; border-radius: 8px; border: 2px dashed #334155;">
                    <p style="color: #64748b; text-align: center;" id="emptyMessage">No rankings selected</p>
                </div>
            </div>

            <div style="display: flex; gap: 10px; justify-content: flex-end;">
                <button id="cancelBtn" class="btn btn-secondary">Cancel</button>
                <button id="savePlaylistBtn" class="btn btn-primary" style="background: linear-gradient(135deg, #10b981 0%, #059669 100%);">Save Playlist</button>
            </div>
        </div>
    </div>

    <script src="../js/playlists-manager.js?v=2"></script>
</body>
</html>
